<!-- AI Tutor Modal Component -->
<!-- Add this to any lesson page to enable AI tutoring -->

<div id="tutorModal" class="tutor-modal hidden">
    <div class="tutor-modal-content">
        <!-- Header -->
        <div class="tutor-header">
            <h2>🤖 AI Tutor</h2>
            <button id="closeTutorBtn" class="close-btn" aria-label="Close tutor">×</button>
        </div>

        <!-- Chat History -->
        <div id="tutorChat" class="tutor-chat-history">
            <div class="tutor-welcome">
                <p>Hello! I'm your AI tutor. Ask me any questions about the current lesson.</p>
                <p class="tutor-hint">💡 Tip: Ask for explanations, examples, or hints about concepts.</p>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="tutorLoading" class="tutor-loading hidden">
            <div class="tutor-spinner"></div>
            <p>Thinking...</p>
        </div>

        <!-- Input Area -->
        <div class="tutor-input-area">
            <div class="tutor-input-wrapper">
                <input
                    id="tutorInput"
                    type="text"
                    class="tutor-input"
                    placeholder="Ask me anything..."
                    maxlength="2000"
                    aria-label="Type your question for the AI tutor"
                />
                <button id="sendTutorBtn" class="tutor-send-btn" aria-label="Send question">
                    📤 Send
                </button>
            </div>
            <div class="tutor-char-count">
                <span id="charCount">0</span> / 2000
            </div>
        </div>

        <!-- Options -->
        <div class="tutor-options">
            <button id="saveTutorBtn" class="tutor-option-btn" title="Save this conversation">
                💾 Save
            </button>
            <button id="clearTutorBtn" class="tutor-option-btn" title="Clear conversation">
                🗑️ Clear
            </button>
            <button id="historyTutorBtn" class="tutor-option-btn" title="View conversation history">
                📋 History
            </button>
        </div>
    </div>
</div>

<!-- Floating Tutor Button -->
<button id="openTutorBtn" class="tutor-floating-btn" title="Open AI Tutor" aria-label="Open AI Tutor">
    🤖
</button>

<style>
    /* Modal Styling */
    .tutor-modal {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 400px;
        max-height: 600px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 5px 40px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        z-index: 10000;
        animation: slideUp 0.3s ease-out;
    }

    .tutor-modal.hidden {
        display: none;
    }

    @keyframes slideUp {
        from {
            transform: translateY(20px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    /* Header */
    .tutor-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 16px;
        border-radius: 12px 12px 0 0;
    }

    .tutor-header h2 {
        margin: 0;
        font-size: 18px;
    }

    .close-btn {
        background: none;
        border: none;
        color: white;
        font-size: 28px;
        cursor: pointer;
        padding: 0;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
    }

    .close-btn:hover {
        transform: scale(1.2);
    }

    /* Chat History */
    .tutor-chat-history {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .tutor-welcome {
        color: #666;
        font-size: 14px;
        text-align: center;
    }

    .tutor-hint {
        font-size: 12px;
        opacity: 0.7;
        margin-top: 8px;
    }

    /* Messages */
    .tutor-message {
        display: flex;
        margin-bottom: 8px;
        animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(8px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .tutor-message.user {
        justify-content: flex-end;
    }

    .tutor-message.assistant {
        justify-content: flex-start;
    }

    .tutor-bubble {
        max-width: 85%;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.4;
        word-wrap: break-word;
    }

    .tutor-message.user .tutor-bubble {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-bottom-right-radius: 4px;
    }

    .tutor-message.assistant .tutor-bubble {
        background: #f0f0f0;
        color: #333;
        border-bottom-left-radius: 4px;
    }

    /* Loading */
    .tutor-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        gap: 8px;
        color: #666;
        font-size: 14px;
    }

    .tutor-loading.hidden {
        display: none;
    }

    .tutor-spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #ddd;
        border-top-color: #667eea;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    /* Input Area */
    .tutor-input-area {
        padding: 12px;
        border-top: 1px solid #eee;
    }

    .tutor-input-wrapper {
        display: flex;
        gap: 8px;
        margin-bottom: 6px;
    }

    .tutor-input {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        transition: border-color 0.2s;
    }

    .tutor-input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .tutor-send-btn {
        padding: 10px 16px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .tutor-send-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .tutor-send-btn:active {
        transform: translateY(0);
    }

    .tutor-send-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .tutor-char-count {
        font-size: 12px;
        color: #999;
        text-align: right;
    }

    /* Options */
    .tutor-options {
        display: flex;
        gap: 6px;
        padding: 8px 12px;
        border-top: 1px solid #eee;
        background: #f9f9f9;
        border-radius: 0 0 12px 12px;
    }

    .tutor-option-btn {
        flex: 1;
        padding: 8px;
        border: 1px solid #ddd;
        background: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.2s;
    }

    .tutor-option-btn:hover {
        background: #f0f0f0;
        border-color: #667eea;
    }

    /* Floating Button */
    .tutor-floating-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        font-size: 24px;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        transition: transform 0.2s, box-shadow 0.2s;
        z-index: 9999;
    }

    .tutor-floating-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .tutor-floating-btn:active {
        transform: scale(0.95);
    }

    .tutor-floating-btn.hidden {
        display: none;
    }

    /* Responsive */
    @media (max-width: 600px) {
        .tutor-modal {
            width: 100%;
            max-width: 400px;
            bottom: 0;
            right: 0;
            border-radius: 12px 12px 0 0;
            max-height: 80vh;
        }

        .tutor-floating-btn {
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            font-size: 20px;
        }
    }

    /* Scrollbar Styling */
    .tutor-chat-history::-webkit-scrollbar {
        width: 6px;
    }

    .tutor-chat-history::-webkit-scrollbar-track {
        background: #f1f1f1;
    }

    .tutor-chat-history::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 3px;
    }

    .tutor-chat-history::-webkit-scrollbar-thumb:hover {
        background: #555;
    }
</style>

<script type="module">
    import { validateQuestion, buildSystemPrompt } from '../auth/ai-tutor.js';

    // DOM Elements
    const modal = document.getElementById('tutorModal');
    const openBtn = document.getElementById('openTutorBtn');
    const closeBtn = document.getElementById('closeTutorBtn');
    const input = document.getElementById('tutorInput');
    const sendBtn = document.getElementById('sendTutorBtn');
    const chatHistory = document.getElementById('tutorChat');
    const loading = document.getElementById('tutorLoading');
    const charCount = document.getElementById('charCount');
    const saveBtn = document.getElementById('saveTutorBtn');
    const clearBtn = document.getElementById('clearTutorBtn');
    const historyBtn = document.getElementById('historyTutorBtn');

    // State
    let messages = [];
    let isLoading = false;

    // Event Listeners
    openBtn.addEventListener('click', () => {
        modal.classList.remove('hidden');
        input.focus();
    });

    closeBtn.addEventListener('click', () => {
        modal.classList.add('hidden');
    });

    input.addEventListener('input', (e) => {
        charCount.textContent = e.target.value.length;
    });

    sendBtn.addEventListener('click', sendQuestion);
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendQuestion();
        }
    });

    clearBtn.addEventListener('click', () => {
        if (confirm('Clear all messages? This cannot be undone.')) {
            messages = [];
            chatHistory.innerHTML = '<div class="tutor-welcome"><p>Hello! I\'m your AI tutor. Ask me any questions about the current lesson.</p></div>';
            input.value = '';
            charCount.textContent = '0';
        }
    });

    saveBtn.addEventListener('click', () => {
        if (messages.length < 2) {
            alert('Save at least one exchange (question + answer) before saving.');
            return;
        }
        alert('✅ Conversation saved! (Feature requires backend integration)');
    });

    historyBtn.addEventListener('click', () => {
        alert('📋 View your saved conversations here. (Feature requires backend integration)');
    });

    /**
     * Send a question to the tutor
     */
    async function sendQuestion() {
        const question = input.value.trim();

        // Validate
        const validation = validateQuestion(question);
        if (!validation.isValid) {
            alert(`⚠️ ${validation.error}`);
            return;
        }

        // Add user message
        addMessage(question, 'user');
        input.value = '';
        charCount.textContent = '0';
        sendBtn.disabled = true;

        // Show loading
        isLoading = true;
        loading.classList.remove('hidden');

        try {
            // Call Claude API (requires backend function)
            const response = await callTutorAPI(question, messages);

            // Add AI response
            addMessage(response, 'assistant');
        } catch (error) {
            console.error('Error calling tutor API:', error);
            addMessage(
                '❌ Sorry, I encountered an error. Please try again.',
                'assistant'
            );
        } finally {
            isLoading = false;
            loading.classList.add('hidden');
            sendBtn.disabled = false;
            input.focus();
        }
    }

    /**
     * Add message to chat
     */
    function addMessage(content, role) {
        const message = { role, content, timestamp: Date.now() };
        messages.push(message);

        const div = document.createElement('div');
        div.className = `tutor-message ${role}`;

        const bubble = document.createElement('div');
        bubble.className = 'tutor-bubble';
        bubble.textContent = content;

        div.appendChild(bubble);
        chatHistory.appendChild(div);

        // Scroll to bottom
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    /**
     * Call AI Tutor API (requires Firebase Cloud Function)
     * This is a placeholder - backend function needed
     */
    async function callTutorAPI(question, conversationHistory) {
        // This would call a Firebase Cloud Function
        // For now, return a demo response
        return 'This is a demo response. To enable the AI Tutor, you need to set up a Firebase Cloud Function that calls the Claude API.';
    }
</script>
